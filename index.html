<!DOCTYPE html>
<html>
<head>
    <title>The Big Eye - Web AR</title>
    <!-- We use A-Frame for AR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* This creates the "HUD" (Overlay) on top of the camera */
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 15px;
            border-radius: 10px; width: 90%; font-family: sans-serif;
        }
        input { width: 70%; padding: 10px; }
        button { padding: 10px; background: #007bff; color: white; border: none; }
        #response { margin-top: 10px; font-size: 14px; line-height: 1.4; color: #00ff00; }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- THE HUD INTERFACE -->
    <div id="hud">
        <h2>The Big Eye (Spatial RAG)</h2>
        <input type="text" id="query" placeholder="Ask about the printer...">
        <button onclick="askAI()">ASK AI</button>
        <div id="response">Waiting for query...</div>
    </div>

    <!-- THE AR CAMERA -->
    <a-scene embedded arjs>
        <a-marker-camera preset="hiro"></a-marker-camera>
    </a-scene>

    <script>
       async function askAI() {
            const query = document.getElementById('query').value;
            const responseDiv = document.getElementById('response');
            
            // 1. USE YOUR CURRENT NGROK URL FROM THE SCREENSHOT
const NGROK_URL = "https://smugness-vanity-hazard.ngrok-free.dev/ask";

            responseDiv.innerText = "Thinking...";

            try {
                const res = await fetch(NGROK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' // <--- ADD THIS LINE (CRITICAL)
                    },
                    body: JSON.stringify({ "question": query })
                });

                const data = await res.json();
                responseDiv.innerText = data.answer;
            } catch (err) {
                responseDiv.innerText = "Error: " + err;
            }
        }
    </script>
</body>
</html>
